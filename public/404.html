<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
        // Получаем путь без домена
        var path = window.location.pathname;
        var repoName = '/rsvp-lyosha-i-masha';

        // Если это не главная страница, перенаправляем
        if (path !== repoName && path !== repoName + '/') {
            window.location.href = repoName + '/index.html';
        }
    </script>
</head>
<body>
<p>Redirecting to <a href="/rsvp-lyosha-i-masha/">home page</a>...</p>
</body>
</html>
